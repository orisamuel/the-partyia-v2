<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>טריילר צוות הפרתיה</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Heebo:wght@700;900&display=block">
<link rel="stylesheet" href="../brand.css">
<style>
/*
 * trailer.html: טריילר "צוות הפרתיה", במה של 1080x1920.
 * כל תנועה יושבת על timeline אחד של GSAP שנבנה מתוך cues.json.
 * דטרמיניסטי: בלי אנימציות CSS ובלי transitions (גם המצמוץ של brand.css כבוי כאן), בלי Math.random ובלי Date.
 *   ?render   מצב צילום (render.mjs קורא ל-window.__seek(t) לכל פריים)
 *   ?preview  מצב צפייה: הקשה מנגנת את הטיימליין בזמן אמת עם audio/mix.wav  (&t=12 מתחיל משנייה 12)
 */
*, *::before, *::after { animation: none !important; transition: none !important; }
html, body { margin: 0; height: 100%; background: #04070d; overflow: hidden; }
body { -webkit-font-smoothing: antialiased; }
#stage { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: hidden; transform-origin: 0 0;
  background: var(--night-1); font-family: 'Heebo', sans-serif; direction: rtl; color: var(--cream); }
#world, .scene, .cam, .mid, .fg, .ovl { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
.scene { visibility: hidden; }
.bg { position: absolute; left: -110px; top: -110px; width: 1300px; height: 2140px; }
.abs { position: absolute; }
.title { position: absolute; left: 0; top: 0; white-space: nowrap; text-align: center; }
.ink { font-weight: 900; line-height: 1.05; padding: .22em .32em; letter-spacing: 0;
  -webkit-mask-image: var(--speckle); mask-image: var(--speckle);
  -webkit-mask-size: 560px 560px; mask-size: 560px 560px; }
.ovl { pointer-events: none; }
#grain { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; mix-blend-mode: overlay; opacity: .15; pointer-events: none; }
#scratch { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
svg { overflow: visible; }
/* preview UI (לא חלק מהסרטון) */
#ui { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 10; cursor: pointer;
  background: rgba(4, 7, 13, .35); font-family: 'Heebo', sans-serif; }
#ui .play { width: 96px; height: 96px; border-radius: 50%; background: linear-gradient(135deg, #E8873B, #D35400);
  display: flex; align-items: center; justify-content: center; box-shadow: 0 12px 40px rgba(211, 84, 0, .5); }
#ui .play::after { content: ''; margin-right: -8px; border-style: solid; border-width: 20px 0 20px 32px; border-color: transparent transparent transparent #fff; }
#bar { position: fixed; left: 0; right: 0; bottom: 0; height: 6px; background: rgba(255,255,255,.12); z-index: 11; display: none; cursor: pointer; }
#bar i { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: #E8873B; }
#tc { position: fixed; left: 10px; bottom: 12px; z-index: 11; font: 700 12px/1 'Heebo', monospace; color: rgba(242,232,213,.6); display: none; direction: ltr; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="../deer.js"></script>
</head>
<body>
<div id="stage">
  <div id="world"></div>
  <div class="ovl" id="whiteout" style="background:radial-gradient(circle at 50% 50%, #FFF4DE 0%, #FFE2B4 55%, #FFD08E 100%);opacity:0"></div>
  <div class="ovl" id="amber" style="background:radial-gradient(circle at 50% 38%, #FFD9A0 0%, #F2A04E 45%, #D35400 100%);mix-blend-mode:screen;opacity:0"></div>
  <div class="ovl" id="flash" style="background:#FFF6E8;opacity:0"></div>
  <div class="ovl" id="fade" style="background:#060b15;opacity:0"></div>
  <div class="ovl" id="vignette" style="background:radial-gradient(ellipse 78% 62% at 50% 46%, rgba(0,0,0,0) 55%, rgba(0,0,0,.5) 100%)"></div>
  <canvas id="grain" width="360" height="640"></canvas>
  <canvas id="scratch" width="540" height="960"></canvas>
  <div class="ovl" id="flicker" style="background:#000;opacity:0"></div>
</div>
<div id="ui"><div class="play"></div></div>
<div id="bar"><i></i></div>
<div id="tc"></div>
<script>
(async () => {
'use strict';
const P = new URLSearchParams(location.search);
const RENDER = P.has('render');
const FPS = 30;
const NS = 'http://www.w3.org/2000/svg';
const BR = '#3a1a10', OR = '#E8873B', OD = '#D35400', OM = '#DE7A33', CR = '#F2E8D5', CL = '#FBEBCB', CD = '#cfc4ad';
const N1 = '#0e1a2e', N2 = '#16263f', N3 = '#1d3050', WARM = '#FFD38A', SUN = '#EF8B2F', EYE = '#2a120a';
const SPARK = 'M0 -10 C 1.2 -2.2, 2.2 -1.2, 10 0 C 2.2 1.2, 1.2 2.2, 0 10 C -1.2 2.2, -2.2 1.2, -10 0 C -2.2 -1.2, -1.2 -2.2, 0 -10 Z';
const SH_DARK = '0 5px 0 rgba(6,11,22,.42), 0 18px 44px rgba(0,0,0,.55)';
const SH_LIGHT = '0 4px 0 rgba(58,26,16,.10), 0 14px 34px rgba(58,26,16,.16)';
const SH_GLOW = '0 0 50px rgba(232,135,59,.55), 0 6px 0 rgba(58,26,16,.55), 0 18px 44px rgba(0,0,0,.5)';

/* ---------- דטרמיניזם ---------- */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function hash(n) { n = n | 0; n = Math.imul(n ^ 0x9e3779b9, 0x85ebca6b); n ^= n >>> 13; n = Math.imul(n, 0xc2b2ae35); n ^= n >>> 16; return (n >>> 0) / 4294967296; }
const rnd = mulberry32(20261006);
const R = (a, b) => a + (b - a) * rnd();
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;

/* ---------- טעינה ---------- */
const cues = await fetch('cues.json', { cache: 'no-store' }).then(r => r.json());
const DUR = cues.duration;
const Q = {}, TX = {};
cues.titles.forEach(c => { Q[c.id] = c.t; TX[c.id] = c.text; });
const CARD_END = (cues.titles.find(c => c.id === 'card') || {}).end || 3.0;
const sfxNear = (name, t) => { let best = null; for (const s of cues.sfx) if (s.file.includes(name) && (best === null || Math.abs(s.t - t) < Math.abs(best - t))) best = s.t; return best === null ? t : best; };

const HEB = 'אבגדהוזחטיכךלמםנןסעפףצץקרשת.,?';
await Promise.all([document.fonts.load('900 100px Heebo', HEB), document.fonts.load('700 100px Heebo', HEB)]);
await document.fonts.ready;
const loadImg = src => new Promise((res, rej) => { const i = new Image(); i.onload = () => i.decode().then(() => res(i), () => res(i)); i.onerror = rej; i.src = src; });

function makeSpeckle() {
  const c = document.createElement('canvas'); c.width = c.height = 560;
  const x = c.getContext('2d'); const r = mulberry32(7);
  x.fillStyle = '#000'; x.fillRect(0, 0, 560, 560);
  x.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 1700; i++) {
    const big = r() < .08; x.globalAlpha = .3 + r() * .7;
    x.beginPath(); x.arc(r() * 560, r() * 560, big ? 1.6 + r() * 2.6 : .5 + r() * 1.2, 0, 7); x.fill();
  }
  x.lineCap = 'round';
  for (let i = 0; i < 18; i++) {
    x.globalAlpha = .35 + r() * .4; x.lineWidth = .6 + r() * 1.3;
    const px = r() * 560, py = r() * 560, a = r() * 6.28, l = 10 + r() * 50;
    x.beginPath(); x.moveTo(px, py); x.lineTo(px + Math.cos(a) * l, py + Math.sin(a) * l); x.stroke();
  }
  return c.toDataURL('image/png');
}
const speckleURL = makeSpeckle();
const [emblemImg, wordImg] = await Promise.all([loadImg('assets/emblem.webp'), loadImg('assets/wordmark.webp'), loadImg(speckleURL)]);
document.documentElement.style.setProperty('--speckle', `url(${speckleURL})`);

/* ---------- עזרים ---------- */
const stage = document.getElementById('stage');
const world = document.getElementById('world');
const flashEl = document.getElementById('flash');
const whiteEl = document.getElementById('whiteout');
const amberEl = document.getElementById('amber');
const fadeEl = document.getElementById('fade');
const vigEl = document.getElementById('vignette');
const flickerEl = document.getElementById('flicker');
const grainEl = document.getElementById('grain');
const scratchEl = document.getElementById('scratch');

const tl = gsap.timeline({ paused: true });
const ft = (t, a, b, at) => tl.fromTo(t, a, Object.assign({ immediateRender: false }, b), at);
const to = (t, v, at) => tl.to(t, v, at);
const set = (t, v, at) => tl.set(t, v, at);

function el(tag, cls, css, parent) { const e = document.createElement(tag); if (cls) e.className = cls; if (css) e.style.cssText = css; if (parent) parent.appendChild(e); return e; }
function html(parent, s) { const t = document.createElement('template'); t.innerHTML = s.trim(); const nodes = [...t.content.children]; nodes.forEach(n => parent.appendChild(n)); return nodes.length === 1 ? nodes[0] : nodes; }
function svgBox(parent, css) {
  const s = document.createElementNS(NS, 'svg'); s.setAttribute('viewBox', '0 0 1080 1920');
  s.style.cssText = 'position:absolute;left:0;top:0;width:1080px;height:1920px;' + (css || ''); parent.appendChild(s); return s;
}
const measureCtx = document.createElement('canvas').getContext('2d');
function textW(txt, size, weight = 900) { measureCtx.font = `${weight} ${size}px Heebo`; return measureCtx.measureText(txt).width; }

const scenes = [];
function makeScene(id, bgCss, a, b) {
  const e = el('div', 'scene', '', world); e.id = 's-' + id;
  const bg = el('div', 'bg', `background:${bgCss}`, e);
  const cam = el('div', 'cam', '', e);
  const mid = el('div', 'mid', '', e);
  const fg = el('div', 'fg', '', e);
  gsap.set(e, { autoAlpha: a <= 0 ? 1 : 0 });
  if (a > 0) set(e, { autoAlpha: 1 }, a);
  set(e, { autoAlpha: 0 }, b);
  const s = { id, el: e, bg, cam, mid, fg, a, b };
  scenes.push(s);
  return s;
}

/* כותרות: טקסט מדויק מ-cues.json. split מחלק לשורות רק אם החיבור שווה בדיוק לטקסט */
const titles = {};
function makeTitle(parent, id, o) {
  const text = TX[id];
  if (text === undefined) throw new Error('missing cue ' + id);
  let lines = [text];
  if (o.split) { const parts = o.split.split('|'); if (parts.join(' ') === text) lines = parts; else console.warn('split mismatch', id); }
  const wrap = el('div', 'title', '', parent);
  const ink = el('div', 'ink', `font-size:${o.size}px;color:${o.color || CR};line-height:${o.lh || 1.04};font-weight:${o.weight || 900};text-shadow:${o.shadow || SH_DARK};-webkit-mask-position:${(rnd() * 560) | 0}px ${(rnd() * 560) | 0}px`, wrap);
  lines.forEach(l => { el('div', '', '', ink).textContent = l; });
  const t = { id, wrap, ink, o, x: o.x === undefined ? 540 : o.x, y: o.y, lines };
  const maxW = o.maxW || 900;
  const pad = parseFloat(getComputedStyle(ink).paddingLeft) * 2;
  const w = ink.offsetWidth - pad;
  if (w > maxW) ink.style.fontSize = (o.size * maxW / w).toFixed(1) + 'px';
  gsap.set(wrap, { x: t.x, y: t.y, xPercent: -50, yPercent: -50, autoAlpha: 0 });
  titles[id] = t;
  return t;
}
function tIn(t, at, style = 'fade', d) {
  const w = t.wrap;
  set(w, { autoAlpha: 1 }, at);
  if (style === 'fade') ft(w, { opacity: .42, y: t.y + 28 }, { opacity: 1, y: t.y, duration: d || .5, ease: 'power3.out' }, at);
  else if (style === 'slam') {
    // הפריים הראשון של הסלאם לא יוצא מהמסגרת: הגודל ההתחלתי מוגבל לפי רוחב הכותרת
    const pad = parseFloat(getComputedStyle(t.ink).paddingLeft) * 2;
    const s0 = Math.max(1.12, Math.min(1.42, 1040 / Math.max(1, t.ink.offsetWidth - pad)));
    ft(w, { scale: s0 }, { scale: 1, duration: d || .26, ease: 'expo.out' }, at);
  }
  else if (style === 'pop') ft(w, { scale: .5 }, { scale: 1, duration: d || .45, ease: 'back.out(2.3)' }, at);
  else if (style === 'right') ft(w, { opacity: .25, x: t.x + 150 }, { opacity: 1, x: t.x, duration: d || .55, ease: 'power3.out' }, at);
  else if (style === 'spacing') {
    const dd = d || 1.4;
    ft(t.ink, { letterSpacing: '64px', filter: 'blur(12px)' }, { letterSpacing: '0px', filter: 'blur(0px)', duration: dd, ease: 'power3.out' }, at);
    ft(w, { opacity: .3 }, { opacity: 1, duration: .55, ease: 'power1.out' }, at);
    set(t.ink, { filter: 'none' }, at + dd + .02);
  }
}
function tOut(t, at, d = .16) { to(t.wrap, { autoAlpha: 0, duration: d, ease: 'power1.in' }, at); }

/* מצלמה: רעידות (רכיב לכל אירוע, הסכום מחושב בכל פריים) */
const shakes = [];
function shake(at, amp, dur = .6) { const s = { a: 0, k: shakes.length * 977 + 13 }; shakes.push(s); ft(s, { a: amp }, { a: 0, duration: dur, ease: 'power2.out' }, at); }
function flash(at, op = .75, d = .16) { ft(flashEl, { opacity: op }, { opacity: 0, duration: d, ease: 'power2.out' }, at); }
function push(target, a, b, s0, s1, origin) { if (origin) gsap.set(target, { transformOrigin: origin }); ft(target, { scale: s0 }, { scale: s1, duration: b - a, ease: 'none' }, a); }

function dust(parent, at, cx, cy, n = 26, spread = 420, w = 500, color = CL) {
  for (let i = 0; i < n; i++) {
    const s = R(5, 15);
    const d = el('div', 'abs', `left:${cx - s / 2}px;top:${cy - s / 2}px;width:${s}px;height:${s}px;border-radius:50%;background:${color};`, parent);
    gsap.set(d, { autoAlpha: 0 });
    const ang = R(Math.PI * 1.04, Math.PI * 1.96), dist = R(spread * .3, spread), x0 = R(-w / 2, w / 2);
    ft(d, { autoAlpha: R(.55, .95), x: x0, y: R(-10, 20), scale: R(.6, 1.3) },
      { x: x0 + Math.cos(ang) * dist, y: Math.sin(ang) * dist * .5 + R(40, 120), autoAlpha: 0, scale: R(.2, .5), duration: R(.8, 1.4), ease: 'power3.out' }, at);
  }
}
function sparkleEl(parent, size, color) {
  const e = el('div', 'abs', `left:${-size / 2}px;top:${-size / 2}px;width:${size}px;height:${size}px`, parent);
  e.innerHTML = `<svg viewBox="-10 -10 20 20" width="${size}" height="${size}"><path d="${SPARK}" fill="${color}"/></svg>`;
  return e;
}
function burst(parent, at, cx, cy, n = 14, spread = 380, colors = [CL, WARM, OR]) {
  for (let i = 0; i < n; i++) {
    const sz = R(40, 92), e = sparkleEl(parent, sz, colors[i % colors.length]);
    gsap.set(e, { x: cx, y: cy, autoAlpha: 0 });
    const ang = (i / n) * Math.PI * 2 + R(-.25, .25), dist = R(spread * .45, spread), dur = R(.75, 1.15);
    set(e, { autoAlpha: 1 }, at);
    ft(e, { x: cx, y: cy, scale: .15, rotation: 0 }, { x: cx + Math.cos(ang) * dist, y: cy + Math.sin(ang) * dist, scale: R(.8, 1.3), rotation: R(-100, 100), duration: dur, ease: 'power3.out' }, at);
    to(e, { autoAlpha: 0, duration: .3, ease: 'power1.in' }, at + dur - .3);
  }
}

/* נצנוץ כוכבים: מחושב לכל פריים מזמן ה-timeline */
const twinkles = [];
const procs = [];
function stars(parent, n, area, seed, win, opts = {}) {
  const r = mulberry32(seed);
  const svg = svgBox(parent);
  let s = '';
  const meta = [];
  for (let i = 0; i < n; i++) {
    const x = area.x0 + r() * (area.x1 - area.x0), y = area.y0 + Math.pow(r(), opts.pow || 1.25) * (area.y1 - area.y0);
    if (r() < (opts.big || .28)) { const sz = 6 + r() * 13; s += `<path transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${(sz / 10).toFixed(2)})" d="${SPARK}" fill="${r() < .22 ? WARM : CL}"/>`; }
    else s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1.3 + r() * 2.4).toFixed(1)}" fill="${CL}"/>`;
    meta.push({ base: .35 + r() * .4, amp: .2 + r() * .35, sp: 1.1 + r() * 3, ph: r() * 6.28 });
  }
  svg.innerHTML = s;
  [...svg.children].forEach((node, i) => twinkles.push(Object.assign({ el: node, sc: win[0], se: win[1], mul: opts.mul || 1 }, meta[i])));
  return svg;
}

/* שרשרת נורות (המוטיב של האתר) */
let gid = 0;
function strand(parent, o) {
  const { x0, y0, x1, y1, sag, n } = o; const br = o.r || 15;
  const my = (y0 + y1) / 2 + sag, cx = (x0 + x1) / 2, cy = 2 * my - (y0 + y1) / 2;
  const id = 'bgl' + (gid++);
  const svg = svgBox(parent);
  let s = `<defs><radialGradient id="${id}"><stop offset="0" stop-color="#FFE1A8" stop-opacity=".9"/><stop offset=".3" stop-color="#FFB45A" stop-opacity=".38"/><stop offset="1" stop-color="#E8873B" stop-opacity="0"/></radialGradient></defs>`;
  s += `<path d="M${x0} ${y0} Q${cx} ${cy} ${x1} ${y1}" fill="none" stroke="${o.wire || '#2a3a56'}" stroke-width="4"/>`;
  for (let i = 0; i < n; i++) {
    const u = (i + .5) / n;
    const px = (1 - u) * (1 - u) * x0 + 2 * u * (1 - u) * cx + u * u * x1, py = (1 - u) * (1 - u) * y0 + 2 * u * (1 - u) * cy + u * u * y1;
    s += `<g class="bulb" transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${R(-9, 9).toFixed(1)})">
      <circle class="glow" cx="0" cy="${br * 2.2}" r="${br * 4.4}" fill="url(#${id})" opacity="0"/>
      <rect x="-6" y="-2" width="12" height="${br * .95}" rx="2" fill="#1a2436"/>
      <ellipse cx="0" cy="${br * 2.1}" rx="${br * .78}" ry="${br}" fill="#3b4760"/>
      <g class="lit" opacity="0"><ellipse cx="0" cy="${br * 2.1}" rx="${br * .78}" ry="${br}" fill="#FFDCA6"/><ellipse cx="${-br * .25}" cy="${br * 1.75}" rx="${br * .2}" ry="${br * .38}" fill="#fff" opacity=".85"/></g></g>`;
  }
  svg.innerHTML = s;
  const bulbs = [...svg.querySelectorAll('.bulb')].map(b => ({ g: b, glow: b.querySelector('.glow'), lit: b.querySelector('.lit') }));
  return { svg, bulbs };
}
function bulbOn(b, at, d = .05) { ft([b.glow, b.lit], { opacity: 0 }, { opacity: 1, duration: d }, at); }

/* ---------- הצבי ---------- */
const S5 = `stroke="${BR}" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"`;
const PROP = {
  phone: `<g ${S5}><rect x="-21" y="-64" width="42" height="88" rx="10" fill="${N3}"/><rect x="-14" y="-55" width="28" height="62" rx="4" fill="#BFE3FF" stroke="none"/><rect x="-6" y="-60" width="12" height="3" rx="1.5" fill="${N1}" stroke="none"/></g>`,
  chair: `<g ${S5}><path d="M6 -4 V136 M66 -4 V136" fill="none" stroke-width="7"/><rect x="-2" y="-8" width="76" height="40" rx="9" fill="${OR}"/><path d="M-6 64 H78 L72 82 H0 Z" fill="${OM}"/><path d="M2 82 L-8 136 M70 82 L80 136" fill="none" stroke-width="7"/><path d="M-2 114 H74" fill="none" stroke-width="4"/></g>`,
  beer: `<g ${S5}><path d="M26 -52 C 50 -52, 50 -14, 26 -14" fill="none" stroke-width="11"/><path d="M26 -52 C 46 -52, 46 -14, 26 -14" fill="none" stroke="#F4A24A" stroke-width="3"/><rect x="-28" y="-66" width="56" height="70" rx="9" fill="#F4A24A"/><rect x="-18" y="-52" width="8" height="46" rx="4" fill="#FFD9A0" stroke="none"/><circle cx="8" cy="-28" r="3.2" fill="#FFE2B0" stroke="none"/><circle cx="-1" cy="-14" r="2.4" fill="#FFE2B0" stroke="none"/><circle cx="12" cy="-48" r="2.2" fill="#FFE2B0" stroke="none"/><path d="M-34 -62 C -38 -82, -16 -90, -8 -78 C 0 -94, 22 -90, 22 -76 C 36 -86, 46 -64, 32 -60 Z" fill="${CL}"/></g>`,

if (!RENDER) {
  const ui = document.getElementById('ui'), bar = document.getElementById('bar'), barI = bar.firstElementChild, tc = document.getElementById('tc');
  ui.style.display = 'flex'; bar.style.display = 'block'; tc.style.display = 'block';
  const audio = new Audio('audio/mix.wav'); audio.preload = 'auto';
  let playing = false, anchor = 0, cur = t0;
  const show = t => { cur = t; renderAt(t); barI.style.width = (t / DUR * 100).toFixed(2) + '%'; tc.textContent = t.toFixed(2) + 's'; };
  show(t0);
  function loop() {
    if (!playing) return;
    let t = (performance.now() - anchor) / 1000;
    if (Math.abs(t - audio.currentTime) > .12 && !audio.paused) { anchor = performance.now() - audio.currentTime * 1000; t = audio.currentTime; }
    if (t >= DUR || audio.ended) { stop(); show(DUR - 1e-3); return; }
    show(t); requestAnimationFrame(loop);
  }
  function play() { if (cur >= DUR - .05) cur = 0; audio.currentTime = cur; audio.play().catch(() => {}); anchor = performance.now() - cur * 1000; playing = true; ui.style.display = 'none'; requestAnimationFrame(loop); }
  function stop() { playing = false; audio.pause(); ui.style.display = 'flex'; }
  ui.addEventListener('click', play);
  stage.addEventListener('click', () => { if (playing) stop(); });
  bar.addEventListener('click', e => { const t = e.clientX / innerWidth * DUR; if (playing) { audio.currentTime = t; anchor = performance.now() - t * 1000; } show(t); });
  addEventListener('keydown', e => {
    if (e.code === 'Space') { e.preventDefault(); playing ? stop() : play(); }
    if (e.code === 'ArrowRight' || e.code === 'ArrowLeft') { const t = Math.max(0, Math.min(DUR, cur + (e.code === 'ArrowRight' ? 2 : -2))); if (playing) { audio.currentTime = t; anchor = performance.now() - t * 1000; } show(t); }
  });
}
})().catch(err => { console.error(err); window.__error = String(err && err.stack || err); });
</script>
</body>
